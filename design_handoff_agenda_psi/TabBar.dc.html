<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-top:.5px solid var(--sep,#E3E3E8);background:var(--surface,#fff);padding-top:6px;flex:none">
  <div style="display:flex;align-items:flex-start;justify-content:space-around;height:49px">
    <div style="width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ cInicio }}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11 12 4l9 7v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path></svg>
      <span style="font-size:10px;font-weight:500">Início</span>
    </div>
    <div style="width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ cAgenda }}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2.5"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
      <span style="font-size:10px;font-weight:500">Agenda</span>
    </div>
    <div style="width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ cPacientes }}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.4"></circle><path d="M2.6 19c0-3.1 2.9-5.4 6.4-5.4s6.4 2.3 6.4 5.4M16 5.6a3.4 3.4 0 0 1 0 6.6M18 14c2 .7 3.4 2.4 3.4 4.4"></path></svg>
      <span style="font-size:10px;font-weight:500">Pacientes</span>
    </div>
    <div style="width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ cDespesas }}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2Z"></path><path d="M9 8h6M9 12h6"></path></svg>
      <span style="font-size:10px;font-weight:500">Despesas</span>
    </div>
    <div style="width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;color:{{ cConfig }}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"></path></svg>
      <span style="font-size:10px;font-weight:500">Config.</span>
    </div>
  </div>
  <div style="height:24px;display:flex;align-items:center;justify-content:center"><div style="width:134px;height:5px;border-radius:3px;background:var(--text,#111113);opacity:.28"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;agenda&quot;,&quot;pacientes&quot;,&quot;despesas&quot;,&quot;config&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const on = "var(--brand,#2E6F6B)", off = "var(--text2,#6B6B70)";
    const a = this.props.active || "inicio";
    return {
      cInicio: a === "inicio" ? on : off,
      cAgenda: a === "agenda" ? on : off,
      cPacientes: a === "pacientes" ? on : off,
      cDespesas: a === "despesas" ? on : off,
      cConfig: a === "config" ? on : off,
    };
  }
}
</script>
</body>
</html>
